
# =====================================================
# SonarQube Cloud project identification
# =====================================================

sonar.projectKey=mou-git2_Assignment2-CSCN73030
sonar.organization=mou-git2
sonar.projectName=Assignment2-CSCN73030

# =====================================================
# Source code configuration
# =====================================================

sonar.sources=.

sonar.sourceEncoding=UTF-8

# Exclude generated files, Visual Studio build output,
# and the separate unit test project from application analysis.

sonar.exclusions=**/.vs/**,**/x64/**,**/Win32/**,**/Debug/**,**/Release/**,**/packages/**,**/build_wrapper_output_directory/**,**/PrettyPrintTest/**

# =====================================================
# C++ code coverage
# =====================================================

sonar.cfamily.cobertura.reportPaths=coverage.xml
